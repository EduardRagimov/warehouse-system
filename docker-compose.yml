services:
  rabbitmq:
    image: rabbitmq:3-management
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '512M'
        reservations:
          memory: '256M'
    ports:
      - "5672:5672"   # Message broker port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  postgres-auth:
    image: postgres:18
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
        reservations:
          memory: '256M'
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: pdba
      POSTGRES_PASSWORD: secretpassword123
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data/18/main

  postgres-order:
    image: postgres:18
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
        reservations:
          memory: '256M'
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: pdba
      POSTGRES_PASSWORD: secretpassword123
    volumes:
      - postgres_order_data:/var/lib/postgresql/data/18/main

  postgres-inventory:
    image: postgres:18
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: '1G'
        reservations:
          memory: '256M'
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: pdba
      POSTGRES_PASSWORD: secretpassword123
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data/18/main

volumes:
  postgres_auth_data:
  postgres_order_data:
  postgres_inventory_data: